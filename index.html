<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTH 215 Exam 1 · Interactive Linear Algebra Study Guide</title>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('mth215:theme'));
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/contrib/auto-render.min.js"></script>
</head>
<body>
  <div id="topbar">
    <button id="menu-btn" aria-label="Open menu">&#9776;</button>
    <span>MTH 215 · Exam 1</span>
    <button class="theme-toggle compact" aria-pressed="false" aria-label="Dark mode"><span class="tt-track"><span class="tt-knob"></span></span></button>
  </div>
  <div id="app">
    <aside id="sidebar">
      <a class="brand" href="#/home">
        <div class="brand-mark">[A|b]</div>
        <div>
          <div class="brand-title">MTH 215 · Exam 1</div>
          <div class="brand-sub">Interactive study guide</div>
        </div>
      </a>
      <div class="progress-wrap">
        <div class="progress-label"><span>Your progress</span><span id="progress-text">0%</span></div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
      <button class="theme-toggle" aria-pressed="false"><span>Dark mode</span><span class="tt-track"><span class="tt-knob"></span></span></button>
      <nav id="nav"></nav>
    </aside>
    <main id="main">
      <div id="content"></div>
    </main>
  </div>

  <script defer src="js/core.js"></script>
  <script defer src="js/widgets.js"></script>
  <script defer src="js/lessons/home.js"></script>
  <script defer src="js/lessons/s1_1.js"></script>
  <script defer src="js/lessons/s1_2.js"></script>
  <script defer src="js/lessons/s1_3.js"></script>
  <script defer src="js/lessons/s1_4.js"></script>
  <script defer src="js/lessons/s1_5.js"></script>
  <script defer src="js/lessons/s1_7.js"></script>
  <script defer src="js/lessons/s1_8.js"></script>

  <script defer src="js/lessons/practice.js"></script>
  <script defer src="js/lessons/lab.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
